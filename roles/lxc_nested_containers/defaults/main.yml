---
lxc_nested_containers_enabled: "{{ ansible_facts['virtualization_type'] | default('') in ['lxc', 'lxd'] }}"
lxc_nested_containers_service_name: lxc-nested-containers.service
lxc_nested_containers_before_units: []
lxc_nested_containers_create_dev_kmsg: true
lxc_nested_containers_make_root_rshared: true
lxc_nested_containers_inspect_devices: []
