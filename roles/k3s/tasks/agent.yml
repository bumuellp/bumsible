---
- name: Resolve K3s server URL and cluster token
  ansible.builtin.set_fact:
    k3s_effective_server_url: >-
      {{
        k3s_server_url
        if (k3s_server_url | length > 0)
        else (
          'https://'
          ~ (hostvars[groups[k3s_server_group][0]]['k3s_node_ip']
             | default(hostvars[groups[k3s_server_group][0]]['ansible_host']
                       | default(groups[k3s_server_group][0]), true))
          ~ ':6443'
          if (groups[k3s_server_group] | default([]) | length > 0)
          else ''
        )
      }}
    k3s_effective_token: >-
      {{
        k3s_token
        if (k3s_token | length > 0)
        else (
          hostvars[groups[k3s_server_group][0]]['k3s_cluster_token'] | default('')
          if (groups[k3s_server_group] | default([]) | length > 0)
          else ''
        )
      }}
  no_log: true

- name: Verify K3s server URL and token are resolved
  ansible.builtin.assert:
    that:
      - k3s_effective_server_url | length > 0
      - k3s_effective_token | length > 0
    fail_msg: >-
      Unable to resolve k3s_effective_server_url or k3s_effective_token.
      Set k3s_server_url/k3s_token or run k3s in server mode against {{ k3s_server_group }} first.

- name: Build K3s agent exec arguments
  ansible.builtin.set_fact:
    k3s_agent_exec_args: >-
      {{
        (['--node-ip=' ~ k3s_node_ip] if (k3s_node_ip | length > 0) else [])
        + (['--node-external-ip=' ~ k3s_node_external_ip] if (k3s_node_external_ip | length > 0) else [])
        + (['--flannel-iface=' ~ k3s_flannel_iface] if (k3s_flannel_iface | length > 0) else [])
        + (k3s_node_taints | map('regex_replace', '^(.*)$', '--node-taint=\\1') | list)
        + (k3s_node_labels | map('regex_replace', '^(.*)$', '--node-label=\\1') | list)
        + k3s_extra_args
      }}

- name: Install and start K3s agent
  ansible.builtin.command:
    argv: "{{ ['/usr/local/src/k3s-install.sh', 'agent'] + k3s_agent_exec_args }}"
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "{{ k3s_effective_server_url }}"
    K3S_TOKEN: "{{ k3s_effective_token }}"
  no_log: true

- name: Ensure K3s agent service is enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
    daemon_reload: true
