---
- name: Prepare K3s cluster nodes (baseline packages and LXC nested container prerequisites)
  hosts: "{{ k3s_cluster_group | default('k3s_cluster') }}"
  become: true
  gather_facts: true
  pre_tasks:
    - name: Run optional user-supplied pre-tasks file
      ansible.builtin.include_tasks: "{{ bumsible_pre_tasks_file | default('') }}"
      when: bumsible_pre_tasks_file | default('') | length > 0
  roles:
    - role: bumuellp.bumsible.linux_baseline
    - role: bumuellp.bumsible.lxc_nested_containers
      vars:
        lxc_nested_containers_before_units:
          - k3s.service
          - k3s-agent.service

- name: Bootstrap K3s server nodes
  hosts: "{{ k3s_server_group | default('k3s_servers') }}"
  become: true
  gather_facts: true
  roles:
    - role: bumuellp.bumsible.k3s
      vars:
        k3s_mode: server

- name: Join K3s agent nodes
  hosts: "{{ k3s_agent_group | default('k3s_agents') }}"
  become: true
  gather_facts: true
  roles:
    - role: bumuellp.bumsible.k3s
      vars:
        k3s_mode: agent

- name: Run optional cluster post-tasks hook
  hosts: "{{ k3s_cluster_group | default('k3s_cluster') }}"
  become: true
  gather_facts: false
  tasks:
    - name: Run optional user-supplied post-tasks file
      ansible.builtin.include_tasks: "{{ bumsible_post_tasks_file | default('') }}"
      when: bumsible_post_tasks_file | default('') | length > 0
